<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wortspiel</title>
  <link rel="stylesheet" href="../blog-styles.css">
  <style>
    input {
      font-size: 56px;
    }
    button {
      font-size: 48px;
      margin-top: 4px;
    }
    .letter {
      font-size: 64px;
      background-color: lightblue;
      border-radius: 8px;
      padding: 8px;
      margin: 10px;
      width: 80px;
    }
    .vowel {
      background-color: yellow !important;
    }
  </style>
</head>
<body class="blog">
  <article>
    <h1>Wortspiel mit HTML + JS</h1>
    <p class="blog-meta">2026-08-11</p>
    
    <div id='numplayers' style="font-size:48px">
      Wie viele Spieler spielen jetzt?<br/>
      <input type="number" value="2" style="width:120px" id="num_players">
      <button onclick="start()">Beginnen!</button>
    </div>
    
    <div id="give_player" >
      Spieler <span id="spl_num_1"></span> an der Reihe.<br/>
      Niemand anderer schaut?<br/>
      <button onclick="askWord()">Schau die Buchstaben</button>
    </div>
    
    <div id="askword" >
      Deine Buchstaben:<br/>
      <div id="plr_letters" style="margin:auto"></div>
      <br/>
      Dein Wort aus einige (oder alle) der Buchstaben:
      <input type="text" id="plr_word"
        oninput="this.value=this.value.toUpperCase()"><br/>
      <button onclick="setWord()">Das ist mein Wort</button>
    </div>
    <br/><br/>
    <hr/>
    <details>
      <summary><b>Spielregeln</b></summary>
      Ich schreibe die Regeln hier.
    </details>
    
    <hr/>
    <div id="log"></div>
    
    <script>
    try{
      var el_log = document.getElementById("log");
      var el_numplayers = document.getElementById("numplayers");
      var inp_numplayers = document.getElementById("num_players");
      var el_askword = document.getElementById("askword");
      var el_giveplayer = document.getElementById("give_player");
      var el_playerNum1 = document.getElementById("spl_num_1");
      var el_letters = document.getElementById("plr_letters");
      var el_playerWord = document.getElementById("plr_word");
                  
      var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      var vowels = "AEIOUY";
      var lettersPerPlayer = 8;
      
      var numPlayers = 2;
      var currentPlayer;
      var letters = [];
      
      function log(text) {
        el_log.innerHTML += text + "<br/>";
      }
      function init(){
        el_log.innerHTML = "";
        log("Initialising...");
        el_numplayers.style.display = "visible";
        el_giveplayer.style.display = "none";
        el_askword.style.display = "none";
        numPlayers = 2;
        inp_numplayers.value = numPlayers;
      }
      function start() {
        el_numplayers.style.display = "none";
        numPlayers = +(inp_numplayers.value);
        currentPlayer = 1;
        log("Start with " + numPlayers + " players!");
        givePlayer();
      }
      function givePlayer() {
        el_giveplayer.style.display = "block";
        el_playerNum1.innerHTML = currentPlayer.toString();
      }
      function askWord() {
        log("Ask word " + currentPlayer);
        el_giveplayer.style.display = "none";
        el_askword.style.display = "block";
        giveLetters();
        el_letters.innerHTML = "";
        for (var i=0; i<lettersPerPlayer;i++) {
          el_letters.innerHTML +=
            '<span class="letter'
            + (isVowel(letters[i]) ? " vowel" : "")
            +'">'
            + letters[i]
            +'</span>&nbsp;';
        }
      }
      function setWord() {
        var word = el_playerWord.value.trim();
        log("word:" + word);
        log(isValidWord(word, letters));
      }
      function getRandomInt(max) {
        return Math.floor(Math.random() * max);
      }
      function giveLetters() {
        letters = [];
        for (var i=1; i<=lettersPerPlayer; i++) {
          letters.push(alphabet[getRandomInt(alphabet.length)]);
        }
      }
      function isVowel(ch) { return vowels.includes(ch); }
      function isValidWord(word, letters) {
        if (!word) return false;
        
        var used = [];
        for (var i=0; i<=lettersPerPlayer; i++)
          used.push(false);
        for (let ch of word) {
          var ind;
          do {
            log(ch);
            ind = letters.indexOf(ch);
            log(ind);
          } while (ind>=0 && !used[ind])
          if (ind < 0) return false;
          used[ind] = true;
        }
        return true;
      }
      init();
    } catch (ex) {
      document.getElementById("log").innerHTML = (ex);
    }
    </script>
  </article>
  <p><a href="../index.html" class="blog-back-link">← Back to blog</a></p>
</body>
</html>
